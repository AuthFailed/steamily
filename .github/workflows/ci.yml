name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Release tag to validate and publish
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
      - name: Conventional Commits in English
        env:
          BASE: ${{ inputs.ref == '' && (github.event.pull_request.base.sha || github.event.before) || '' }}
          HEAD: ${{ inputs.ref || github.event.pull_request.head.sha || github.sha }}
        run: |
          # New branches and force-pushes have no usable base: check the pushed commit itself.
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            commits=$(git rev-list --no-merges "$BASE..$HEAD")
          else
            commits="$HEAD"
          fi
          status=0
          for commit in $commits; do
            git log -1 --format=%B "$commit" | python3 scripts/check_commit_msg.py - || { echo "  in $commit"; status=1; }
          done
          exit $status

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: astral-sh/ruff-action@v3
      - run: ruff format --check

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Tests with branch coverage
        run: python -m coverage run -m unittest -v
      - name: Coverage reports
        if: always()
        run: |
          python -m coverage xml --fail-under=0
          python -m coverage html --fail-under=0
          python -m coverage report --format=markdown --fail-under=0 >> "$GITHUB_STEP_SUMMARY"
      - name: Minimum coverage
        if: always()
        run: python -m coverage report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/

  build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    needs: [commits, lint, test]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit
