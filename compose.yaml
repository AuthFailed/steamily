# Start with the interactive setup in README.md before running the bot.

services:
  bot:
    image: ghcr.io/authfailed/steamily:${STEAMILY_VERSION:-main}
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false # Allows the setup command to create it on first run.
    environment:
      DATABASE_URL: postgresql://bot:${POSTGRES_PASSWORD:-}@db/bot
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_DB: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bot"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
