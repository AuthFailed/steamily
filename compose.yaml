# Run the bot:
#   1. cp .env.example .env and fill it in (bot token from @BotFather, SECRET_KEY, POSTGRES_PASSWORD)
#   2. docker compose up -d
#   3. docker compose logs -f bot
# Update to the latest version: docker compose pull && docker compose up -d
# To build from source instead, replace `image:` below with `build: .`

services:
  bot:
    image: ghcr.io/authfailed/steamily:main
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://bot:${POSTGRES_PASSWORD}@db/bot
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bot
      POSTGRES_DB: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bot"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
